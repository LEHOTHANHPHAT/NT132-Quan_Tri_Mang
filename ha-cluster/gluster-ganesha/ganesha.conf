NFS_CORE_PARAM {
    Protocols = 4;
    mount_path_pseudo = true;
}

NFSV4 {
    Graceless = true;
    Minor_Versions = 0;
    Only_Numeric_Owners = true;
    Lease_Lifetime = 10;
    Grace_Period = 10;
    RecoveryBackend = "fs_ng";
}

EXPORT_DEFAULTS {
    Anonymous_Uid = 65534;
    Anonymous_Gid = 65534;
}

EXPORT {
    Export_Id = 1;
    Path = "/gv0/share";
    Pseudo = "/share";
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
    Access_Type = None;
    Squash = Root_Squash;

    FSAL {
        Name = GLUSTER;
        Hostname = "127.0.0.1";
        Volume = "gv0";
        Volpath = "/share";
        glfs_log = "/var/log/ganesha/ganesha-gfapi.log";
        enable_upcall = true;
    }

    CLIENT {
        Clients = 192.168.10.101;
        Access_Type = RW;
        Squash = Root_Squash;
    }

    CLIENT {
        Clients = 192.168.10.0/24;
        Access_Type = RO;
        Squash = Root_Squash;
    }
}

EXPORT {
    Export_Id = 2;
    Path = "/gv0/no_squash";
    Pseudo = "/no_squash";
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
    Access_Type = None;
    Squash = No_Root_Squash;

    FSAL {
        Name = GLUSTER;
        Hostname = "127.0.0.1";
        Volume = "gv0";
        Volpath = "/no_squash";
        glfs_log = "/var/log/ganesha/ganesha-gfapi.log";
        enable_upcall = true;
    }

    CLIENT {
        Clients = 192.168.10.0/24;
        Access_Type = RW;
        Squash = No_Root_Squash;
    }
}

LOG {
    Default_Log_Level = WARN;
}
